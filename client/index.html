<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Clone</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #21262d; margin-bottom: 24px; }
    header h1 { font-size: 1.4rem; color: #58a6ff; }
    .nav-links a { color: #58a6ff; text-decoration: none; margin-right: 16px; font-size: 0.9rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .card h2 { color: #f0f6fc; margin-bottom: 8px; }
    .difficulty { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin: 4px 2px; }
    .diff-easy { background: #3fb950; color: #0d1117; }
    .diff-medium { background: #d29922; color: #0d1117; }
    .diff-hard { background: #f85149; color: #fff; }
    .btn { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-right: 8px; margin-top: 8px; }
    .btn:hover { background: #2ea043; }
    .btn-secondary { background: #21262d; color: #c9d1d9; }
    .btn-secondary:hover { background: #30363d; }
    textarea, input, select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9rem; margin-bottom: 12px; }
    textarea { min-height: 200px; resize: vertical; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 4px; color: #8b949e; font-size: 0.85rem; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
    .tab { padding: 8px 16px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .hidden { display: none; }
    .code-editor { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 16px; font-family: 'SF Mono', monospace; font-size: 0.9rem; white-space: pre-wrap; min-height: 250px; color: #c9d1d9; }
    .test-result { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; font-size: 0.9rem; }
    .test-pass { background: rgba(63,185,80,0.15); border-left: 3px solid #3fb950; }
    .test-fail { background: rgba(248,81,73,0.15); border-left: 3px solid #f85149; }
    #login-panel, #register-panel { max-width: 400px; margin: 40px auto; }
  </style>
</head>
<body>
  <div id="auth-section">
    <div id="login-panel" class="card">
      <h2>Login</h2>
      <div class="form-group"><label>Email</label><input id="login-email" type="email" /></div>
      <div class="form-group"><label>Password</label><input id="login-password" type="password" /></div>
      <button class="btn" onclick="handleLogin()">Login</button>
      <p style="margin-top:10px;color:#8b949e;cursor:pointer" onclick="toggleAuth()">Don't have an account? Register</p>
    </div>
    <div id="register-panel" class="card hidden">
      <h2>Register</h2>
      <div class="form-group"><label>Username</label><input id="reg-username" /></div>
      <div class="form-group"><label>Email</label><input id="reg-email" type="email" /></div>
      <div class="form-group"><label>Password</label><input id="reg-password" type="password" /></div>
      <button class="btn" onclick="handleRegister()">Register</button>
      <p style="margin-top:10px;color:#8b949e;cursor:pointer" onclick="toggleAuth()">Already have an account? Login</p>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <div class="container">
      <header>
        <h1>LeetCode Clone</h1>
        <div class="nav-links">
          <span id="user-name" style="color:#8b949e;margin-right:12px"></span>
          <a href="#" onclick="handleLogout()">Logout</a>
        </div>
      </header>

      <div class="tab-bar">
        <div class="tab active" data-tab="problems" onclick="switchTab('problems')">Problems</div>
        <div class="tab" data-tab="solve" onclick="switchTab('solve')">Solve</div>
        <div class="tab" data-tab="my-submissions" onclick="switchTab('my-submissions')">My Submissions</div>
      </div>

      <!-- Problems Tab -->
      <div id="tab-problems">
        <div class="card">
          <h2>Problem List</h2>
          <button class="btn-secondary" onclick="loadProblems()">Refresh</button>
          <div id="problems-list"></div>
        </div>
      </div>

      <!-- Solve Tab -->
      <div id="tab-solve" class="hidden">
        <div class="card">
          <h2 id="solve-title">Select a problem</h2>
          <div id="solve-difficulty"></div>
          <div id="solve-description" style="margin:12px 0;color:#8b949e;font-size:0.9rem"></div>
          <div class="form-group"><label>Starter Code</label><textarea id="starter-code"></textarea></div>
          <div class="form-group"><label>Your Solution</label><textarea id="solution-code"></textarea></div>
          <div class="form-group">
            <label>Language</label>
            <select id="solution-language">
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
            </select>
          </div>
          <button class="btn" onclick="submitSolution()">Submit</button>
          <div id="solve-results"></div>
        </div>
      </div>

      <!-- My Submissions Tab -->
      <div id="tab-my-submissions" class="hidden">
        <div class="card">
          <h2>My Submissions</h2>
          <button class="btn-secondary" onclick="loadMySubmissions()">Refresh</button>
          <div id="submissions-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    let token = localStorage.getItem('lc_token') || '';
    let selectedProblemId = null;

    async function checkAuth() {
      if (token) {
        try {
          const res = await fetch(`${API}/auth/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!res.ok) throw new Error();
          const user = await res.json();
          document.getElementById('user-name').textContent = `Hi, ${user.username}`;
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('app-section').classList.remove('hidden');
        } catch {
          token = '';
          localStorage.removeItem('lc_token');
        }
      }
    }

    function toggleAuth() {
      document.getElementById('login-panel').classList.toggle('hidden');
      document.getElementById('register-panel').classList.toggle('hidden');
    }

    async function handleRegister() {
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('lc_token', token);
        checkAuth();
      } else alert(data.message);
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('lc_token', token);
        checkAuth();
      } else alert(data.message);
    }

    function handleLogout() {
      token = '';
      localStorage.removeItem('lc_token');
      location.reload();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      if (tab === 'problems') loadProblems();
      if (tab === 'my-submissions') loadMySubmissions();
    }

    async function loadProblems() {
      const res = await fetch(`${API}/problems`);
      const problems = await res.json();
      const list = document.getElementById('problems-list');
      list.innerHTML = problems.map(p => `
        <div style="padding:12px;border-bottom:1px solid #30363d;cursor:pointer" onclick="selectProblem('${p._id}','${p.title}','${p.difficulty}','${p.description.replace(/</g,'&lt;')}')">
          <strong style="color:#f0f6fc">${p.title}</strong>
          <span class="difficulty diff-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
          <span style="color:#8b949e;margin-left:8px">${p.category}</span>
        </div>
      `).join('') || '<p style="color:#8b949e">No problems yet. Add some on the server.</p>';
    }

    function selectProblem(id, title, difficulty, description) {
      selectedProblemId = id;
      document.getElementById('solve-title').textContent = title;
      document.getElementById('solve-difficulty').innerHTML = `<span class="difficulty diff-${difficulty.toLowerCase()}">${difficulty}</span>`;
      document.getElementById('solve-description').textContent = description;
      document.getElementById('starter-code').value = '';
      document.getElementById('solution-code').value = '';
      document.getElementById('solve-results').innerHTML = '';
      switchTab('solve');
    }

    async function submitSolution() {
      if (!selectedProblemId) return alert('Select a problem first');
      const code = document.getElementById('solution-code').value;
      const language = document.getElementById('solution-language').value;
      const res = await fetch(`${API}/submissions/submit`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ problemId: selectedProblemId, language, code })
      });
      const submission = await res.json();
      if (!res.ok) return alert(submission.message);

      const results = document.getElementById('solve-results');
      results.innerHTML = submission.testResults.map(r => `
        <div class="test-result ${r.passed ? 'test-pass' : 'test-fail'}">
          ${r.passed ? '✅ PASS' : '❌ FAIL'}: expected <code>${r.expected}</code>, got <code>${r.actual || 'ERROR'}</code>
        </div>
      `).join('') + `
        <div style="margin-top:12px">
          <strong>Status:</strong> ${submission.status}
          <span style="margin-left:12px"><strong>Runtime:</strong> ${submission.runtimeMs}ms</span>
        </div>
      `;
    }

    async function loadMySubmissions() {
      const res = await fetch(`${API}/submissions/my`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const submissions = await res.json();
      const list = document.getElementById('submissions-list');
      list.innerHTML = submissions.map(s => `
        <div class="card" style="margin-bottom:8px;padding:12px">
          <strong>${s.problem?.title || 'Unknown'}</strong>
          <span class="difficulty diff-${s.problem?.difficulty?.toLowerCase() || 'easy'}">
            ${s.problem?.difficulty || 'Easy'}
          </span>
          <span style="color:#8b949e;margin-left:8px">${s.status}</span>
          <span style="color:#8b949e;margin-left:8px">${s.runtimeMs}ms</span>
          <span style="color:#8b949e;margin-left:8px">${new Date(s.createdAt).toLocaleString()}</span>
        </div>
      `).join('') || '<p style="color:#8b949e">No submissions yet.</p>';
    }

    checkAuth();
  </script>
</body>
</html>
